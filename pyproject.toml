[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instruct4d"
version = "1.0.0"
description = "Instruct 4D-to-4D: editing 4D scenes as pseudo-3D scenes using 2D diffusion (CVPR 2024)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Linzhan Mou" }, { name = "Jun-Kun Chen" }, { name = "Yu-Xiong Wang" }]
dynamic = ["dependencies"]

[project.urls]
Paper = "https://arxiv.org/abs/2406.09402"
Homepage = "https://immortalco.github.io/Instruct-4D-to-4D/"
Repository = "https://github.com/Friedrich-M/Instruct-4D-to-4D"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["instruct4d*"]
