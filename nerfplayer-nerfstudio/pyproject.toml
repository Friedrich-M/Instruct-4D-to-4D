[project]
name = "nerfplayer"
version = "0.0.1"
description = "Single-view (monocular) setting of Instruct 4D-to-4D, on a NeRFPlayer backbone"

# `instruct4d` is the repository root package: install it first with
#   pip install -e .
# from the repository root. It provides the shared anchor-aware
# InstructPix2Pix and RAFT code that these pipelines import.
dependencies = [
    "nerfstudio==0.3.2",
    "viser==0.1.3",
]

[tool.setuptools.packages.find]
include = ["nerfplayer*"]

[project.entry-points.'nerfstudio.method_configs']
nerfplayer_nerfacto = 'nerfplayer.nerfplayer_config:nerfplayer_nerfacto'
nerfplayer_ngp = 'nerfplayer.nerfplayer_config:nerfplayer_ngp'
edit_nerfacto = 'nerfplayer.nerfplayer_config:edit_nerfacto'
in2n_nerfacto = 'nerfplayer.nerfplayer_config:in2n_nerfacto'
